{% extends "base.html" %} {% block content %}
<div class="hero-section text-center">
  <div class="hero-content">
    <h1 class="display-4" id="cineshelf-title"></h1>
    <i id="popcorn-icon" class="fa-light fa-popcorn"></i>
    <p class="lead">
      Track, Explore, and Share Your Personal Movie Obsessions.
    </p>
  </div>
  <div class="hero-divider"></div>
</div>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 shadow-lg">
        <h3 class="text-center mb-4">Login</h3>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-warning" role="alert">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}
        <form method="post" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-cta btn-block">Login</button>
          </div>
        </form>
        <div class="mt-3 text-center">
          <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='hero_animation.js') }}"></script>
{% endblock %}
