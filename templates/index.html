<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends "base.html" %}
{% block content %}
<h3>Cinephiles</h3>
<div>
    <ul>
        {% for user in users %}
    <li class="user-entry">
        <h3>{{user.name}}</h3>
        <a href="{{ url_for('get_movies', user_id=user.id) }}" class="btn">Explore Library</a>
    </li>
        {% endfor %}
    </ul>
</div>
<form action="{{ url_for('create_user') }}" method="post">
  <h3>Add New Cinephile</h3>
  <div>
      <input
          type="text"
          name="name"
          placeholder="Enter a cinephile name"
          required>
      <button type="submit">Add Cinephile</button>
  </div>
</form>

{% endblock %}
</body>
</html>
