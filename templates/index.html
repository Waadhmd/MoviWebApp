<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🎬 CineShelf</title>
</head>
<body>
{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Cinephiles</h3>
<div class="list-group mb-4">
        {% for user in users %}
    <div class="list-group-item d-flex justify-content-between align-items-center ">
        <span>{{user.name}}</span>
        <a href="{{ url_for('get_movies', user_id=user.id) }}" class="btn btn-primary btn-sm">Explore Library</a>
    </div>
        {% endfor %}
</div>
<form action="{{ url_for('create_user') }}" method="post" class="mb-4">
  <h4>Add New Cinephile</h4>
  <div class="input-group">
      <input
          type="text"
          name="name"
          placeholder="Enter a cinephile name"
          class="form-control"
          required>
      <button type="submit" class="btn btn-success">Add Cinephile</button>
  </div>
</form>

{% endblock %}
</body>
</html>
